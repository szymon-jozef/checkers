[package]
name = "checkers"
description = "Game of checkers"
version = "0.0.1"
readme = "README.md"
license = "gpl3"
repository = "https://example.com"
authors = [ "szymon-jozef" ]

edition = "2024"

[dependencies]
dirs = "6.0.0"
env_logger = "0.11.11"
log = "0.4.33"
macroquad = "0.4.16"
postcard = { version = "1.1.3", features = ["alloc"] }
rand = "0.10.2"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.4"

[dependencies.uuid]
version = "1.24.0"
features = ["serde", "v4"]
